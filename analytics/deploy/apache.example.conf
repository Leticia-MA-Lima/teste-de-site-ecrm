# Dentro do VirtualHost HTTPS existente. Adaptar ao mecanismo privado do Kuma.
Alias /growth/analytics/ /var/www/html/kuma-painel/growth/analytics/
<Directory /var/www/html/kuma-painel/growth/analytics>
    Options -Indexes
    AllowOverride None
    AuthType Basic
    AuthName "Painel interno SNet"
    AuthUserFile /etc/ecrm360-analytics/panel.htpasswd
    Require valid-user
    DirectoryIndex index.html
    Header always set Cache-Control "no-store"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'"
</Directory>
